<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SYS_INIT</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    padding: 40px;
    box-sizing: border-box;
    text-shadow: 0 0 5px #0f0;
  }
  /* CRT Scanline effect */
  body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }
  #terminal {
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.5;
  }
  #input-line {
    display: flex;
    align-items: center;
    font-size: 16px;
    margin-top: 20px;
  }
  #cmd {
    background: transparent;
    border: none;
    color: #0f0;
    font-family: inherit;
    font-size: inherit;
    outline: none;
    width: 200px;
    caret-color: #0f0;
    text-shadow: inherit;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #0f0;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="terminal"></div>
  <div id="input-line">
    <span>&gt; </span>
    <input type="text" id="cmd" autofocus autocomplete="off">
    <span class="cursor"></span>
  </div>

  <script>
    (function() {
      const terminal = document.getElementById('terminal');
      const cmdInput = document.getElementById('cmd');
      
      const message = 
        "> ESTABLISHING SECURE UPLINK......... [OK]\n" +
        "> BYPASSING NETWORK FIREWALLS....... [OK]\n" +
        "> SPOOFING MAC ADDRESS.............. [OK]\n" +
        "> ACCESSING ROOT KERNEL............. [OK]\n\n" +
        "WARNING: UNAUTHORIZED ACCESS DETECTED.\n" +
        "You have reached a restricted mainframe.\n\n" +
        "If you accept the risks and wish to proceed, type 'yes'.\n" +
        "Otherwise, simply scroll away, and this encounter never happened.";

      let typewriterInterval;
      let i = 0;

      function typeWriter() {
        if (i < message.length) {
          terminal.innerHTML += message.charAt(i);
          i++;
        } else {
          clearInterval(typewriterInterval);
        }
      }

      setTimeout(() => {
        typewriterInterval = setInterval(typeWriter, 20);
      }, 500);

      function selfDestruct() {
        // Remove event listeners to prevent re-triggering
        window.removeEventListener('wheel', selfDestruct);
        window.removeEventListener('touchmove', selfDestruct);
        cmdInput.removeEventListener('input', checkInput);
        
        // Clear typewriter
        clearInterval(typewriterInterval);

        // Obliterate the entire DOM, leaving zero proof in the Elements tab
        document.documentElement.innerHTML = '<head></head><body></body>';
        
        // Clear any variables
        terminal = null;
        cmdInput = null;
      }

      function checkInput() {
        if (cmdInput.value.trim().toLowerCase() === 'yes') {
          selfDestruct();
        }
      }

      // Triggers: Typing 'yes' or Scrolling (mouse wheel or touch)
      cmdInput.addEventListener('input', checkInput);
      window.addEventListener('wheel', selfDestruct);
      window.addEventListener('touchmove', selfDestruct);
    })();
  </script>
</body>
</html>
